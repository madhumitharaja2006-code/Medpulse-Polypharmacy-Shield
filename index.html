    html, body {

      overflow-y: auto;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.04);

      background-size: 12px 12px;
    }

      font-family: 'Caveat', cursive;
      font-weight: 700;
      line-height: 1.25;
    }

    .doctor-stamp {
      border: 2px dashed #1e3a8a;
      color: #1e3a8a;
      transform: rotate(-3deg);
    }

    @keyframes scanbeam {
      0% { top: 0%; opacity: 0.8; }

                      </div>

                      {/* Confirmation Action */}
                      <button
                        onClick={() => {
                          togglePillLock(activeVisualPill.id);
                          setActiveVisualPill(null);
                        }}
                        className="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs shadow-md shadow-emerald-600/30 flex items-center justify-center gap-1.5"
                      >
                        <Icon name="check" className="w-4 h-4" />
                        <span>{t.matchConfirmation}</span>
                      </button>
                    </div>
                  );
                })()}
              </div>
            </div>
          )}

          {/* =========================================================================
              MODAL: EDIT PATIENT PROFILE
              ========================================================================= */}
          {showProfileModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in">
              <div className="w-full max-w-sm rounded-3xl bg-white p-5 shadow-2xl space-y-4 text-left">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                  <h3 className="text-sm font-extrabold text-slate-900">{t.editProfile}</h3>
                  <button onClick={() => setShowProfileModal(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-700 mb-1">Patient Full Name</label>
                    <input
                      type="text"
                      value={patient.name}
                      onChange={(e) => setPatient(p => ({ ...p, name: e.target.value }))}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 font-semibold"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[11px] font-bold text-slate-700 mb-1">Age (Years)</label>
                      <input
                        type="number"
                        value={patient.age}
                        onChange={(e) => setPatient(p => ({ ...p, age: parseInt(e.target.value) || 62 }))}
                        className="w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 font-semibold"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-700 mb-1">Blood Group</label>
                      <select
                        value={patient.bloodGroup}
                        onChange={(e) => setPatient(p => ({ ...p, bloodGroup: e.target.value }))}
                        className="w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 font-semibold bg-white"
                      >
                        <option value="O+ve">O+ve</option>
                        <option value="A+ve">A+ve</option>
                        <option value="B+ve">B+ve</option>
                        <option value="AB+ve">AB+ve</option>
                        <option value="O-ve">O-ve</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-700 mb-1">Caregiver / Son Phone</label>
                    <input
                      type="text"
                      value={patient.phoneMasked}
                      onChange={(e) => setPatient(p => ({ ...p, phoneMasked: e.target.value }))}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 font-semibold"
                    />
                  </div>
                </div>

                <button
                  onClick={() => setShowProfileModal(false)}
                  className="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-xs shadow-md shadow-blue-500/20"
                >
                  Save Patient Record
                </button>
              </div>
            </div>
          )}

          {/* =========================================================================
              MODAL: UNIFIED PATIENT QR CODE
              ========================================================================= */}
          {showQrModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in">
              <div className="w-full max-w-sm rounded-3xl bg-white p-6 shadow-2xl text-center space-y-4">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100 text-left">
                  <div>
                    <h3 className="text-sm font-extrabold text-slate-900">{t.unifiedQr}</h3>
                    <p className="text-[10px] text-slate-400">UID: MEDPULSE-IN-2026-KS62</p>
                  </div>
                  <button onClick={() => setShowQrModal(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                {/* Big Dynamic QR Image in Modal */}
                <div className="p-4 bg-slate-50 border border-slate-200 rounded-2xl flex flex-col items-center justify-center space-y-2">
                  <img
                    src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=MEDPULSE-IN-2026-KS62-REPORTS"
                    alt="Unified Patient QR Code"
                    onClick={() => {
                      setShowQrModal(false);
                      setActiveTab('reports');
                      speak("Doctor scanned Patient QR. Navigating directly to verified diagnostic reports.");
                    }}
                    className="w-48 h-48 object-contain rounded-lg cursor-pointer hover:opacity-80 transition-opacity"
                  />
                  <button 
                    onClick={() => {
                      setShowQrModal(false);
                      setActiveTab('reports');
                      speak("Doctor scanned Patient QR. Navigating directly to verified diagnostic reports.");
                    }} 
                    className="mt-3 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl flex items-center justify-center gap-2 shadow-md w-full transition-all active:scale-98"
                  >
                    📱 Simulate Doctor Scan → Opens Reports
                  </button>
                </div>

                <div className="text-xs text-slate-600 font-medium">
                  Scan at any hospital pharmacy or counter to pull verified active medications and block cross-prescribing collisions.
                </div>

                <button
                  onClick={() => setShowQrModal(false)}
                  className="w-full py-2.5 rounded-xl bg-slate-900 text-white font-bold text-xs"
                >
                  Close QR
                </button>
              </div>
            </div>
          )}

          {/* =========================================================================
              MODAL: WHATSAPP DISPATCH TO CARETAKER SON RAMESH
              ========================================================================= */}
          {showWhatsAppModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in">
              <div className="w-full max-w-sm rounded-3xl bg-white p-5 shadow-2xl space-y-4 text-left">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                  <div className="flex items-center space-x-2">
                    <div className="w-7 h-7 rounded-full bg-emerald-500 text-white flex items-center justify-center">
                      <Icon name="phone" className="w-4 h-4" />
                    </div>
                    <span className="text-xs font-black text-slate-900">
                      WhatsApp Dispatch: Ramesh Swamy (Son)
                    </span>
                  </div>
                  <button onClick={() => setShowWhatsAppModal(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <div className="p-3.5 rounded-2xl bg-emerald-50/80 border border-emerald-200 text-xs text-emerald-950 font-mono space-y-2 whitespace-pre-wrap leading-relaxed">
{`Vanakkam Ramesh,

Please book appointment for Appa (Thiru. Krishna Swamy, 62Y) with:
• Doctor: ${activeDoctor.name}
• Specialty: ${activeDoctor.speciality}
• Clinic: ${activeDoctor.hospital}
• OPD Room: ${activeDoctor.opdRoom}
• Target Follow-up: Day ${selectedCalendarDay}
• OPD Slot: ${activeDoctor.timing}

Continuous hospital waitlist slot is now open.`}
                </div>

                <div className="flex items-center justify-between gap-2">
                  <button
                    onClick={() => {
                      setShowWhatsAppModal(false);
                      speak("WhatsApp booking request sent to son Ramesh.");
                    }}
                    className="flex-1 py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs shadow-md shadow-emerald-600/30 flex items-center justify-center gap-1.5"
                  >
                    <Icon name="share" className="w-4 h-4" />
                    <span>Send Message to Son</span>
                  </button>
                  <button
                    onClick={() => setShowWhatsAppModal(false)}
                    className="px-4 py-3 rounded-2xl bg-slate-100 text-slate-700 font-bold text-xs"
                  >
                    Cancel
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* =========================================================================
              MODAL: EMERGENCY CAREGIVER QUICK-SHEET (3-DOT MENU)
              ========================================================================= */}
          {showEmergencyMenu && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in">
              <div className="w-full max-w-sm rounded-3xl bg-white p-5 shadow-2xl space-y-4 text-left">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                  <div className="flex items-center space-x-2">
                    <span className="w-3 h-3 rounded-full bg-red-600 animate-ping"></span>
                    <h3 className="text-xs font-black uppercase text-red-950 tracking-wider">
                      Emergency Quick-Sheet
                    </h3>
                  </div>
                  <button onClick={() => setShowEmergencyMenu(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <div className="p-3 rounded-2xl bg-red-50 border border-red-200 text-xs text-red-950 space-y-1">
                  <p className="font-extrabold text-sm text-red-900">
                    {patient.name} (62 Yrs / Male)
                  </p>
                  <p>Blood Group: <strong className="text-red-900">O+ve</strong></p>
                  <p>Critical Diagnosis: <strong>CKD Stage 3b (eGFR 38), Polyneuropathy, HTN</strong></p>
                  <p>Emergency Contact: <strong>Ramesh Swamy (Son) — +91 98422 11223</strong></p>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={() => {
                      playEmergencyBeep();
                      speak("Dispatching 108 emergency ambulance.");
                    }}
                    className="py-3 rounded-2xl bg-red-600 hover:bg-red-700 text-white font-black text-xs shadow-md shadow-red-600/30 flex items-center justify-center gap-1.5"
                  >
                    <Icon name="phone" className="w-4 h-4" />
                    <span>Call 108 Ambulance</span>
                  </button>
                  <button
                    onClick={() => {
                      speak("Calling son Ramesh Swamy.");
                    }}
                    className="py-3 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-black text-xs shadow-md flex items-center justify-center gap-1.5"
                  >
                    <Icon name="phone" className="w-4 h-4" />
                    <span>Call Son Ramesh</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* =========================================================================
              MODAL: PACS RADIOGRAPH LIGHTBOX (WITH ZERO BROKEN IMAGES)
              ========================================================================= */}
          {activeReportModal && (
            <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-3 animate-in fade-in">
              <div className="w-full max-w-md rounded-3xl bg-slate-950 border border-slate-800 text-white overflow-hidden shadow-2xl flex flex-col max-h-[92vh]">
                {/* PACS Lightbox Header */}
                <div className="p-3.5 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between text-left">
                  <div>
                    <span className="text-[9px] uppercase font-mono tracking-widest text-emerald-400">
                      PACS DICOM VIEWER
                    </span>
                    <h4 className="text-xs font-black text-white truncate max-w-[240px]">
                      {activeReportModal.title}
                    </h4>
                  </div>
                  <button
                    onClick={() => setActiveReportModal(null)}
                    className="p-1 rounded-full text-slate-400 hover:text-white hover:bg-slate-800"
                  >
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                {/* PACS Window/Level Sliders for Radiographs */}
                {activeReportModal.type.includes("dicom") && (
                  <div className="px-4 py-2 bg-slate-900/60 border-b border-slate-800 flex items-center justify-between text-[10px] font-mono text-slate-300">
                    <div className="flex items-center gap-1.5">
                      <span>Bright:</span>
                      <input
                        type="range"
                        min="70"
                        max="160"
                        value={pacsBrightness}
                        onChange={(e) => setPacsBrightness(e.target.value)}
                        className="w-16 accent-blue-500 h-1 bg-slate-700 rounded-lg cursor-pointer"
                      />
                    </div>
                    <div className="flex items-center gap-1.5">
                      <span>Contrast:</span>
                      <input
                        type="range"
                        min="80"
                        max="200"
                        value={pacsContrast}
                        onChange={(e) => setPacsContrast(e.target.value)}
                        className="w-16 accent-blue-500 h-1 bg-slate-700 rounded-lg cursor-pointer"
                      />
                    </div>
                    <button
                      onClick={() => setPacsInvert(prev => !prev)}
                      className={`px-2 py-0.5 rounded text-[9px] font-bold border ${pacsInvert ? "bg-amber-400 text-slate-950 border-amber-400" : "bg-slate-800 text-slate-200 border-slate-700"}`}
                    >
                      Invert
                    </button>
                  </div>
                )}

                {/* Main Lightbox Body */}
                <div className="flex-1 overflow-y-auto p-3 flex flex-col items-center justify-center relative bg-black min-h-[260px]">
                  {activeReportModal.type === "ecg" ? (
                    <div className="w-full thermal-ecg-grid rounded-xl p-3 border border-rose-300 text-slate-900 overflow-hidden shadow-inner">
                      <div className="font-mono text-[9px] font-bold text-rose-900 flex justify-between mb-1">
                        <span>LEAD II (25mm/s, 10mm/mV)</span>
                        <span>HR: 74 BPM • PEAKED T-WAVES</span>
                      </div>
                      <svg className="w-full h-32" viewBox="0 0 400 100" preserveAspectRatio="none">
                        <path
                          d="M 0 50 L 20 50 L 25 45 L 30 50 L 40 50 L 45 60 L 50 15 L 55 75 L 60 50 L 70 50 L 78 30 L 86 50 L 110 50 
                             L 130 50 L 135 45 L 140 50 L 150 50 L 155 60 L 160 15 L 165 75 L 170 50 L 180 50 L 188 30 L 196 50 L 220 50 
                             L 240 50 L 245 45 L 250 50 L 260 50 L 265 60 L 270 15 L 275 75 L 280 50 L 290 50 L 298 30 L 306 50 L 330 50 
                             L 350 50 L 355 45 L 360 50 L 370 50 L 375 60 L 380 15 L 385 75 L 390 50 L 400 50"
                          fill="none"
                          stroke="#be123c"
                          strokeWidth="2"
                        />
                      </svg>
                      <p className="text-[9px] font-mono text-rose-800 font-bold text-center mt-1">
                        Left Ventricular Hypertrophy (LVH) with Peaked T-Waves
                      </p>
                    </div>
                  ) : activeReportModal.type.includes("dicom") ? (
                    /* GENUINE REAL PHOTOGRAPHIC MEDICAL RADIOGRAPHS (DICOM STYLE) */
                    <div className="relative group w-full flex items-center justify-center overflow-hidden min-h-[260px] bg-black rounded-xl select-none">
                      {/* DICOM Overlay HUD: Watermark, Matrix data, Orientation Marker */}
                      <div className="absolute top-3 right-3 z-10 font-bold font-mono text-sm text-yellow-400 border border-yellow-400/50 px-2 py-0.5 rounded bg-black/60 shadow-md">
                        R
                      </div>
                      <div className="absolute top-3 left-3 z-10 font-mono text-[9px] text-emerald-400/90 leading-tight bg-black/60 p-1.5 rounded border border-emerald-500/20 shadow-md text-left">
                        KVp: 120 | mAs: 3.2<br/>
                        Matrix: 2048x2048<br/>
                        SID: 180cm • DICOM 3.0
                      </div>

                      {/* Genuine Photographic Radiograph / MRI / CT Image */}
                      <img
                        src={activeReportModal.imgUrl}
                        alt={activeReportModal.title}
                        referrerPolicy="no-referrer"
                        crossOrigin="anonymous"
                        style={{
                          filter: `brightness(${pacsBrightness}%) contrast(${pacsContrast}%) ${pacsInvert ? "invert(1)" : ""}`
                        }}
                        className="max-h-72 w-auto object-contain rounded-lg shadow-2xl transition-all"
                      />
                    </div>
                  ) : (
                    /* Realistic Paper Prescription Slip */
                    <div className="w-full paper-texture rounded-xl p-4 text-slate-900 border border-amber-300 shadow-xl rotate-[-0.5deg] text-left">
                      <div className="border-b-2 border-blue-900/60 pb-1 mb-2">
                        <p className="font-tamil font-bold text-blue-950 text-xs">
                          {activeReportModal.hospital}
                        </p>
                        <p className="font-sans font-extrabold text-[10px] text-blue-900 uppercase">
                          SPECIALIST OP CONSULTATION SLIP
                        </p>
                        <p className="text-[9px] text-slate-600 font-mono">OPD No: 88412 • Date: 29-OCT-2026 • Thiru. Krishna Swamy (62Y/M)</p>
                      </div>

                      <div className="doctor-ink text-sm space-y-1">
                        <p className="font-bold text-base">Rx</p>
                        {activeReportModal.id === "rep-neuro-slip" ? (
                          <>
                            <p className="text-base font-black text-blue-950">Tab. Pregabid 150mg -- 0 - 0 - 1 (HS) x 30d</p>
                            <p className="text-sm text-slate-700">c/o Diabetic Peripheral Polyneuropathy, burning feet</p>
                          </>
                        ) : (
                          <>
                            <p className="text-base font-bold text-blue-950">Tab. Voveran SR 75mg -- 1 - 0 - 1 (p.c) x 10d</p>
                            <p className="text-base font-bold text-blue-950">Tab. Pan 40mg -- 1 - 0 - 0 (a.c) x 10d</p>
                            <p className="text-sm text-slate-700">c/o severe bilateral knee pain, o/e crepitus (+)</p>
                          </>
                        )}
                      </div>

                      <div className="flex items-center justify-between mt-3 pt-2 border-t border-slate-300">
                        <div className="doctor-stamp px-3 py-1 text-[8px] font-sans font-black uppercase text-center">
                          Dr. Specialist Reg: 45120
                        </div>
                        <div className="doctor-ink text-sm font-bold text-blue-900 rotate-[-8deg]">
                          Dr. Specialist
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                {/* Radiologist Formal Impression */}
                <div className="p-3 bg-slate-900 border-t border-slate-800 space-y-1 text-left">
                  <div className="flex items-center justify-between">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                      Diagnostic Impression
                    </span>
                    <span className="text-[9px] font-mono text-emerald-400">Verified by Radiologist</span>
                  </div>
                  <p className="text-xs text-slate-200 font-medium">
                    {activeReportModal.result}
                  </p>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Direct Mount
    ReactDOM.createRoot(document.getElementById("root")).render(<MedPulseApp />);
  </script>
</body>
</html>
